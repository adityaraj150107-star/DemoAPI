$kind: http-request
url: "{{base_url}}/api/v3/tasks"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"title":"Postman task","description":"Complete the assigned exercise.","assigned_to":{{student_id}}}'
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Teacher creates assigned task', function () { pm.response.to.have.status(201); });
      pm.environment.set('task_id', pm.response.json().id);
    language: text/javascript
order: 4000
