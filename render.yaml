services:
  - type: web
    name: demoapi-task-manager
    runtime: python
    plan: free
    region: oregon
    rootDir: Day-05-FastAPI-PostgreSQL-SQLAlchemy/Task-02-SQLAlchemy-CRUD
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: demoapi-task-manager-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: SEED_TEACHER_EMAIL
        sync: false
      - key: SEED_TEACHER_PASSWORD
        sync: false
      - key: SEED_STUDENT_EMAIL
        sync: false
      - key: SEED_STUDENT_PASSWORD
        sync: false

databases:
  - name: demoapi-task-manager-db
    databaseName: demoapi_day5
    user: demoapi
    plan: free
    region: oregon
