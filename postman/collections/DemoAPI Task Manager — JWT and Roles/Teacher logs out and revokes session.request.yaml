$kind: http-request
url: "{{base_url}}/auth/logout"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Logout revokes the session', function () { pm.response.to.have.status(204); });
      pm.environment.set('revoked_access_token', pm.environment.get('access_token'));
    language: text/javascript
order: 26000
