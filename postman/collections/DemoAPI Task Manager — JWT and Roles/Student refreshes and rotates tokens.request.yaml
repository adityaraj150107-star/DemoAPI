$kind: http-request
url: "{{base_url}}/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"refresh_token":"{{refresh_token}}"}'
scripts:
  - type: beforeRequest
    code: pm.environment.set('previous_refresh_token', pm.environment.get('refresh_token'));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Refresh token rotates', function () { pm.response.to.have.status(200); });
      const data = pm.response.json();
      pm.environment.set('access_token', data.access_token);
      pm.environment.set('refresh_token', data.refresh_token);
    language: text/javascript
order: 12000
