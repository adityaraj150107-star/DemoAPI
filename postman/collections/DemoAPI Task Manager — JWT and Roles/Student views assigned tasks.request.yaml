$kind: http-request
url: "{{base_url}}/api/v3/tasks"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: pm.test('Student sees assigned task', function () { pm.response.to.have.status(200); pm.expect(pm.response.json().some(task => task.id == pm.environment.get('task_id'))).to.be.true; });
    language: text/javascript
order: 10000
