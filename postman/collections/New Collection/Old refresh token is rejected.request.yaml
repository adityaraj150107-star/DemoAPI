$kind: http-request
url: "{{base_url}}/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"refresh_token":"{{previous_refresh_token}}"}'
scripts:
  - type: afterResponse
    code: pm.test('Previously rotated token is rejected', function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 13000
