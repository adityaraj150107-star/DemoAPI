$kind: http-request
url: "{{base_url}}/api/v3/tasks/{{task_id}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"assigned_to":{{student_id}}}'
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: pm.test('Student cannot assign task', function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 14000
