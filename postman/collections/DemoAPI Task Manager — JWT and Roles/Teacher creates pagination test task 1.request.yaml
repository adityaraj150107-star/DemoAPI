$kind: http-request
url: "{{base_url}}/api/v3/tasks"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"title":"Postman pagination test","assigned_to":{{student_id}}}'
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: pm.test('Pagination test task is created', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 5000
