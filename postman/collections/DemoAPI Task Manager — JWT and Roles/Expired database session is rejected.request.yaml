$kind: http-request
url: "{{base_url}}/auth/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: pm.test('Expired session returns 401', function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 22000
