$kind: http-request
url: "{{base_url}}/api/v3/tasks/{{task_id}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: pm.test('Student cannot delete task', function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 15000
