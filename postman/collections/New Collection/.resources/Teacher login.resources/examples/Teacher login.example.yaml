$kind: http-example
request:
  url: http://127.0.0.1:8000/auth/login
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: '{"email":"{{teacher_email}}","password":"{{teacher_password}}"}'
response:
  statusCode: 200
  statusText: OK
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "access_token": "<redacted>",
        "refresh_token": "<redacted>",
        "token_type": "bearer",
        "expires_in": 900,
        "user": {
          "id": 1,
          "name": "Teacher",
          "email": "{{teacher_email}}",
          "is_active": true,
          "role": "teacher"
        }
      }
order: 1000
