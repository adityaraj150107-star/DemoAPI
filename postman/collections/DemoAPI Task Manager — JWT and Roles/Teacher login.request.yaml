$kind: http-request
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email":"{{teacher_email}}","password":"{{teacher_password}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Teacher login succeeds', function () { pm.response.to.have.status(200); });
      const data = pm.response.json();
      pm.environment.set('access_token', data.access_token);
      pm.environment.set('refresh_token', data.refresh_token);
      pm.environment.set('teacher_id', data.user.id);
    language: text/javascript
examples: .resources/Teacher login.resources/examples
order: 1000
